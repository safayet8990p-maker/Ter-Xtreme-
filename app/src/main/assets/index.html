<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ter Xtreme</title>
  <link rel="stylesheet" href="https://appassets.androidplatform.net/assets/vendor/xterm.css">
  <link rel="stylesheet" href="https://appassets.androidplatform.net/assets/style.css">
</head>
<body>
  <div id="set" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-label="Settings">
      <b>Settings · v2.0.1</b>
      <label>
        <span>Theme</span>
        <select id="s-theme">
          <option value="auto">Auto (Dark / Light)</option>
          <option value="dark">Full Dark</option>
          <option value="light">Full Light</option>
        </select>
      </label>
      <label>
        <span>Font size (<span id="s-font-val">14</span>px)</span>
        <input id="s-font" type="range" min="10" max="24" value="14">
      </label>
      <label>
        <span>Key bar</span>
        <input id="s-keys" type="checkbox" checked>
      </label>
      <label>
        <span>Storage (/storage/emulated/0)</span>
        <button id="s-storage" type="button" class="inline-btn">Grant Access</button>
      </label>
      <div class="btns">
        <button id="s-bindbg" type="button">Binary Debug</button>
        <button id="s-update" type="button">Linux Update</button>
        <button id="s-plug" type="button">Plugins &amp; Themes</button>
        <button id="s-wipe" type="button">Reset UI</button>
        <button id="s-close" type="button">Done</button>
      </div>
    </div>
  </div>

  <div id="plug" class="ov" hidden>
    <div class="top">
      <button id="p-back" type="button">‹ Back</button>
      <input id="p-search" type="search" placeholder="Search Theme Packs &amp; Alpine packages" aria-label="Search plugins and themes">
    </div>
    <div id="p-cats" class="cats"></div>
    <div id="p-list" class="list"></div>
  </div>

  <div id="drawer-backdrop" hidden></div>
  <aside id="tab-drawer" aria-label="Terminal tabs" hidden>
    <div class="drawer-head">
      <b>Sessions</b>
      <button id="drawer-close" type="button" aria-label="Close drawer">×</button>
    </div>
    <div id="tabs" role="tablist"></div>
    <button id="tab-add" type="button">+ New Tab</button>
  </aside>

  <header>
    <i class="dot" aria-hidden="true"></i>
    <b>Ter Xtreme</b>
    <span id="hp">v2.0.1 · alpine</span>
    <button id="btn-update" type="button" aria-label="Linux Update">Linux Update</button>
    <button id="gear" type="button" aria-label="Settings">⚙</button>
  </header>

  <main id="term-wrap" aria-label="Terminal viewport"></main>

  <div id="free-write" hidden>
    <input id="fw-input" type="text" placeholder="Free writing bar (Gboard / voice / text)..." autocomplete="on" autocorrect="on" spellcheck="true" aria-label="Free writing input">
    <button id="fw-send" type="button">Send</button>
    <button id="fw-enter" type="button" aria-label="Send with Enter">↵</button>
    <button id="fw-close" type="button" aria-label="Close free writing bar">×</button>
  </div>

  <div id="keys" role="toolbar" aria-label="Terminal extra keys"></div>

  <script src="https://appassets.androidplatform.net/assets/vendor/xterm.js"></script>
  <script src="https://appassets.androidplatform.net/assets/vendor/addon-fit.js"></script>
  <script src="https://appassets.androidplatform.net/assets/app.js"></script>
</body>
</html>
