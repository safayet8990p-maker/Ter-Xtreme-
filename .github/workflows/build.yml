name: Build Ter Xtreme APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      prebuilt_proot_url:
        description: "Optional HTTPS URL to prebuilt arm64 libproot.so (leave blank to build from Termux proot NDK source)"
        required: false
        default: ""
      prebuilt_proot_sha256:
        description: "Required SHA256 if prebuilt_proot_url is provided"
        required: false
        default: ""
      prebuilt_loader_url:
        description: "Optional HTTPS URL to prebuilt arm64 libproot-loader.so"
        required: false
        default: ""
      prebuilt_loader_sha256:
        description: "Required SHA256 if prebuilt_loader_url is provided"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27c & CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Obtain arm64-v8a libproot.so & libproot-loader.so
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          PREBUILT_PROOT_URL: ${{ github.event.inputs.prebuilt_proot_url }}
          PREBUILT_PROOT_SHA256: ${{ github.event.inputs.prebuilt_proot_sha256 }}
          PREBUILT_LOADER_URL: ${{ github.event.inputs.prebuilt_loader_url }}
          PREBUILT_LOADER_SHA256: ${{ github.event.inputs.prebuilt_loader_sha256 }}
        run: |
          OUT_DIR="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT_DIR"

          if [[ -n "$PREBUILT_PROOT_URL" && -n "$PREBUILT_LOADER_URL" ]]; then
            if [[ -z "$PREBUILT_PROOT_SHA256" || -z "$PREBUILT_LOADER_SHA256" ]]; then
              echo "ERROR: Both prebuilt_proot_sha256 and prebuilt_loader_sha256 are required when using prebuilt URLs." >&2
              exit 1
            fi
            curl -fsSL "$PREBUILT_PROOT_URL" -o "$OUT_DIR/libproot.so"
            curl -fsSL "$PREBUILT_LOADER_URL" -o "$OUT_DIR/libproot-loader.so"
            echo "$PREBUILT_PROOT_SHA256  $OUT_DIR/libproot.so" | sha256sum -c -
            echo "$PREBUILT_LOADER_SHA256  $OUT_DIR/libproot-loader.so" | sha256sum -c -
            chmod 755 "$OUT_DIR/libproot.so" "$OUT_DIR/libproot-loader.so"
          else
            chmod +x scripts/build_proot_arm64.sh
            bash scripts/build_proot_arm64.sh
          fi

      - name: Verify packaged arm64-v8a native libraries
        run: |
          ls -lh app/src/main/jniLibs/arm64-v8a/libproot.so app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          file app/src/main/jniLibs/arm64-v8a/libproot.so app/src/main/jniLibs/arm64-v8a/libproot-loader.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run unit tests & build Debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ter-xtreme-debug-apk
          path: app/build/outputs/apk/debug/*.apk
